services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clarifi
      POSTGRES_USER: clarifi
      POSTGRES_PASSWORD: clarifi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarifi -d clarifi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
